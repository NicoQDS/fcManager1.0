<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fcM Home</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="theme.css" rel="stylesheet" />
    <link href="index.css" rel="stylesheet" />
  </head>
  <body>
    <div id="homeContainer" class="container">
      <h1 id="homeTitle">fcManager<span id="homeSubtitle">mantra</span></h1>
      <div id="homeCards" class="row">
        <div class="col-12 col-md-5">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Continue Existing Auction</h5>
              <p class="card-text">
                Resume an auction from a previously saved file.
              </p>
              <button id="continueAuctionBtn" class="btn btn-primary">
                Continue
              </button>
            </div>
          </div>
        </div>
        <div class="col-12 col-md-5">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Set Up New Auction</h5>
              <p class="card-text">Start a brand new auction from scratch.</p>
              <a href="new-auction.html" class="btn btn-orange">New Auction</a>
            </div>
          </div>
        </div>
      </div>
      <input type="file" id="continueAuctionFile" class="d-none" />
      <div class="version">Version 1.0</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
