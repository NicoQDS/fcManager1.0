<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fcManager - New Auction</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="theme.css" rel="stylesheet" />
    <link href="new-auction.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container py-5">
      <h1 id="pageTitle">
        Auction Settings<span id="homeSubtitle2"> mantra</span>
      </h1>

      <form id="newAuctionForm" class="mx-auto">
        <fieldset id="settingsFields">
          <div class="mb-4">
            <label for="leagueName" class="form-label">League name</label>
            <input
              type="text"
              class="form-control"
              id="leagueName"
              placeholder="e.g. Serie A Fantasy League"
            />
          </div>

          <div id="creditsPlayersRow" class="row">
            <div class="col-auto">
              <label for="initialCredits" class="form-label"
                >Initial credits</label
              >
              <div id="initialCredits-group" class="input-group">
                <input
                  type="number"
                  class="form-control"
                  id="initialCredits"
                  value="500"
                  min="300"
                  max="1000"
                />
                <span class="input-group-text">fM</span>
              </div>
            </div>

            <div class="col-auto">
              <div
                id="maxBuyableBlock"
                class="form-check form-switch d-flex align-items-center mb-0"
              >
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="enableMaxBuyable"
                />
                <label class="form-check-label ms-2 me-2" for="enableMaxBuyable"
                  >Max number of players</label
                >
                <input
                  type="number"
                  class="form-control"
                  id="maxBuyable"
                  value="30"
                  disabled
                />
              </div>
            </div>
          </div>

          <div class="row mb-4">
            <div class="col-auto">
              <label for="numTeams" class="form-label">Number of teams</label>
              <input
                type="number"
                class="form-control"
                id="numTeams"
                value="8"
                min="2"
                max="10"
              />
            </div>
          </div>

          <div class="mb-4">
            <div id="teamNamesBlock"></div>
          </div>
        </fieldset>

        <div class="text-end">
          <button type="button" id="continueBtn" class="btn btn-orange px-5">
            Continue
          </button>
          <a href="index.html" class="btn btn-secondary px-3 me-2">Back</a>
        </div>
      </form>

      <div id="playersUploadSection" class="mx-auto mt-4 d-none">
        <label for="playersFile" class="form-label">Players file (.xlsx)</label>
        <input
          type="file"
          class="form-control"
          id="playersFile"
          accept=".xlsx,.xls"
        />
        <button
          type="button"
          id="createAuctionBtn"
          class="btn btn-orange mt-3 d-none"
        >
          Create Auction
        </button>
        <div id="saveStatus" class="mt-3"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="new-auction.js"></script>
  </body>
</html>
