<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fcManager - Auction</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="theme.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container py-5">
      <a href="index.html" class="btn btn-secondary mb-4">Back</a>
      <h1>Auction (placeholder)</h1>
      <p class="text-muted">Loaded data below — real auction screen comes later.</p>

      <div id="summary" class="my-4"></div>

      <details>
        <summary>Raw JSON</summary>
        <pre id="raw" class="bg-light p-3 mt-2"></pre>
      </details>
    </div>

    <script>
      const stored = sessionStorage.getItem('fcmAuction');

      if (!stored) {
        document.getElementById('summary').innerHTML =
          '<div class="alert alert-warning">No auction loaded. Go back and pick a file.</div>';
      } else {
        const a = JSON.parse(stored);
        document.getElementById('summary').innerHTML = `
          <ul class="list-group">
            <li class="list-group-item"><strong>League:</strong> ${a.leagueName}</li>
            <li class="list-group-item"><strong>Initial credits:</strong> ${a.initialCredits ?? '—'}</li>
            <li class="list-group-item"><strong>Max buyable:</strong> ${
              a.maxBuyableEnabled ? a.maxBuyable : 'disabled'
            }</li>
            <li class="list-group-item"><strong>Teams (${a.teams.length}):</strong> ${a.teams.join(', ')}</li>
            <li class="list-group-item"><strong>Players:</strong> ${a.players.length}</li>
          </ul>`;
        document.getElementById('raw').textContent = JSON.stringify(a, null, 2);
      }
    </script>
  </body>
</html>
