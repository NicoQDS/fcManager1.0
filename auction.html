<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fcManager - Auction</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="theme.css" rel="stylesheet" />
    <link href="auction.css" rel="stylesheet" />
  </head>
  <body>
    <div id="auctionLayout">
      <!-- HEADER -->
      <header id="auctionHeader">
        <h1 id="auctionLeague">League name</h1>
        <div class="header-right">
          <span id="soldCounter" class="text-muted">sold 0 / 0</span>
          <button id="saveBtn" class="btn btn-orange btn-sm">Save</button>
          <a href="index.html" class="btn btn-secondary btn-sm">Exit</a>
        </div>
      </header>

      <!-- MIDDLE: player list + teams sidebar -->
      <main id="auctionMain">
        <!-- PLAYER LIST -->
        <section id="playerListZone">
          <div id="playerPanel">
            <div id="playerListControls">
              <!-- SELECTION: search + current pick + assign controls -->
              <div id="selectionSection">
                <div id="searchWrap">
                  <input
                    type="search"
                    id="playerSearch"
                    class="form-control form-control-sm"
                    placeholder="Search player…"
                    autocomplete="off"
                    role="combobox"
                    aria-expanded="false"
                    aria-controls="searchResults"
                  />
                  <ul id="searchResults" role="listbox" hidden></ul>
                </div>
                <!-- Current pick and the assign controls share one row. -->
                <div id="pickRow">
                  <span id="selectedPlayer" class="is-empty">
                    <span class="selected-empty">No player selected</span>
                  </span>
                  <div class="action-controls">
                    <input
                      type="number"
                      id="assignPrice"
                      class="form-control form-control-sm"
                      placeholder="price"
                      min="1"
                    />
                    <!-- Bootstrap Icons check, inlined: the icon font isn't loaded. -->
                    <button
                      id="assignBtn"
                      class="btn btn-orange btn-sm"
                      title="Assign"
                      aria-label="Assign"
                    >
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="18"
                        height="18"
                        viewBox="0 0 16 16"
                        fill="currentColor"
                        aria-hidden="true"
                      >
                        <path
                          d="M10.97 4.97a.75.75 0 0 1 1.07 1.05l-3.99 4.99a.75.75 0 0 1-1.08.02L4.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093 3.473-4.425a.24.24 0 0 1 .02-.022z"
                        />
                      </svg>
                    </button>
                    <!-- Bootstrap Icons trash3, inlined: the icon font isn't loaded. -->
                    <button
                      id="resetBtn"
                      class="btn btn-secondary btn-sm"
                      title="Reset"
                      aria-label="Reset"
                    >
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="16"
                        height="16"
                        viewBox="0 0 16 16"
                        fill="currentColor"
                        aria-hidden="true"
                      >
                        <path
                          d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5"
                        />
                      </svg>
                    </button>
                  </div>
                </div>
                <div id="assignMsg" role="status"></div>
              </div>

              <div id="roleFilterActions">
                <span class="text-muted">Roles:</span>
                <button type="button" id="rolesAll" class="btn btn-link btn-sm p-0">Select all</button>
                <button type="button" id="rolesNone" class="btn btn-link btn-sm p-0">Deselect all</button>
                <div id="statusFilters" class="form-check">
                  <input type="checkbox" class="form-check-input" id="hideSold" autocomplete="off" />
                  <label class="form-check-label" for="hideSold">Hide sold</label>
                </div>
              </div>
              <div id="roleFilter" role="group" aria-label="Filter by role">
                <input type="checkbox" class="btn-check" id="role-Por" value="Por" autocomplete="off" />
                <label class="btn btn-sm btn-outline-secondary" for="role-Por">Por</label>
                <input type="checkbox" class="btn-check" id="role-Dd" value="Dd" autocomplete="off" />
                <label class="btn btn-sm btn-outline-secondary" for="role-Dd">Dd</label>
                <input type="checkbox" class="btn-check" id="role-Dc" value="Dc" autocomplete="off" />
                <label class="btn btn-sm btn-outline-secondary" for="role-Dc">Dc</label>
                <input type="checkbox" class="btn-check" id="role-Ds" value="Ds" autocomplete="off" />
                <label class="btn btn-sm btn-outline-secondary" for="role-Ds">Ds</label>
                <input type="checkbox" class="btn-check" id="role-B" value="B" autocomplete="off" />
                <label class="btn btn-sm btn-outline-secondary" for="role-B">B</label>
                <input type="checkbox" class="btn-check" id="role-E" value="E" autocomplete="off" />
                <label class="btn btn-sm btn-outline-secondary" for="role-E">E</label>
                <input type="checkbox" class="btn-check" id="role-M" value="M" autocomplete="off" />
                <label class="btn btn-sm btn-outline-secondary" for="role-M">M</label>
                <input type="checkbox" class="btn-check" id="role-C" value="C" autocomplete="off" />
                <label class="btn btn-sm btn-outline-secondary" for="role-C">C</label>
                <input type="checkbox" class="btn-check" id="role-W" value="W" autocomplete="off" />
                <label class="btn btn-sm btn-outline-secondary" for="role-W">W</label>
                <input type="checkbox" class="btn-check" id="role-T" value="T" autocomplete="off" />
                <label class="btn btn-sm btn-outline-secondary" for="role-T">T</label>
                <input type="checkbox" class="btn-check" id="role-A" value="A" autocomplete="off" />
                <label class="btn btn-sm btn-outline-secondary" for="role-A">A</label>
                <input type="checkbox" class="btn-check" id="role-Pc" value="Pc" autocomplete="off" />
                <label class="btn btn-sm btn-outline-secondary" for="role-Pc">Pc</label>
              </div>
            </div>
            <div id="playerListTableWrap">
              <table class="table table-sm table-hover mb-0">
              <thead>
                <tr>
                  <th id="sortName" class="sortable">
                    Name <span class="sort-caret"></span>
                  </th>
                  <th id="sortTeam" class="sortable">
                    Team <span class="sort-caret"></span>
                  </th>
                  <th id="sortRoles" class="sortable">
                    Roles <span class="sort-caret"></span>
                  </th>
                  <th id="sortQt" class="sortable text-end">
                    Qt <span class="sort-caret"></span>
                  </th>
                  <th class="text-end">FVM</th>
                  <th id="soldHeader" class="text-center">Sold</th>
                </tr>
              </thead>
              <tbody id="playerListBody">
                <!-- sample rows (layout only) -->
                <tr>
                  <td>Lautaro Martinez</td><td>Inter</td>
                  <td><span class="role-badge role-A">A</span></td>
                  <td class="text-end">30</td><td class="text-end">95</td><td class="text-center"></td>
                </tr>
                <tr>
                  <td>Theo Hernandez</td><td>Milan</td>
                  <td><span class="role-badge role-Ds">Ds</span><span class="role-badge role-E">E</span></td>
                  <td class="text-end">18</td><td class="text-end">60</td><td class="text-center"></td>
                </tr>
                <tr class="sold-row">
                  <td>Carnesecchi</td><td>Atalanta</td>
                  <td><span class="role-badge role-Por">Por</span></td>
                  <td class="text-end">18</td><td class="text-end">80</td>
                  <td class="text-center"><span class="badge text-bg-secondary">Nico · 18</span></td>
                </tr>
              </tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- TEAMS SIDEBAR + SALES LOG -->
        <aside id="teamsColumn">
          <div id="teamsPanel">
            <div id="teamsZone">
              <!-- filled from the loaded auction by auction.js -->
            </div>
          </div>

          <div id="logPanel">
            <div id="auctionLogHead">Log</div>
            <ul id="auctionLogList">
              <!-- one entry per sale, newest first -->
            </ul>
          </div>
        </aside>
      </main>
    </div>

    <script src="auction.js"></script>
  </body>
</html>
