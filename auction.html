<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>fcManager</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="theme.css" rel="stylesheet" />
    <link href="auction.css" rel="stylesheet" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 640 640'%3E%3Cpath fill='%23bcbcbc' d='M481.3 424.1L409.7 419.3C404.5 419 399.4 420.4 395.2 423.5C391 426.6 388 430.9 386.8 436L369.2 505.6C353.5 509.8 337 512 320 512C303 512 286.5 509.8 270.8 505.6L253.2 436C251.9 431 248.9 426.6 244.8 423.5C240.7 420.4 235.5 419 230.3 419.3L158.7 424.1C141.1 396.9 130.2 364.9 128.3 330.5L189 292.3C193.4 289.5 196.6 285.3 198.2 280.4C199.8 275.5 199.6 270.2 197.7 265.4L171 198.8C192 173.2 219.3 153 250.7 140.9L305.9 186.9C309.9 190.2 314.9 192 320 192C325.1 192 330.2 190.2 334.1 186.9L389.3 140.9C420.6 153 448 173.2 468.9 198.8L442.2 265.4C440.3 270.2 440.1 275.5 441.7 280.4C443.3 285.3 446.6 289.5 450.9 292.3L511.6 330.5C509.7 364.9 498.8 396.9 481.2 424.1zM320 576C461.4 576 576 461.4 576 320C576 178.6 461.4 64 320 64C178.6 64 64 178.6 64 320C64 461.4 178.6 576 320 576zM334.1 250.3C325.7 244.2 314.3 244.2 305.9 250.3L258 285C249.6 291.1 246.1 301.9 249.3 311.8L267.6 368.1C270.8 378 280 384.7 290.4 384.7L349.6 384.7C360 384.7 369.2 378 372.4 368.1L390.7 311.8C393.9 301.9 390.4 291.1 382 285L334.1 250.2z'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="auctionLayout">
      <!-- HEADER -->
      <header id="auctionHeader">
        <div class="header-left">
          <h1 id="auctionLeague">League name</h1>
          <span id="rulesetBadge" class="ruleset-badge"></span>
        </div>
        <div class="header-right"></div>
      </header>

      <!-- MIDDLE: player list + teams sidebar -->
      <main id="auctionMain">
        <!-- PLAYER LIST -->
        <section id="playerListZone">
          <div id="playerPanel">
            <div id="playerListControls">
              <!-- SELECTION: search + current pick + assign controls -->
              <div id="selectionSection">
                <div id="searchWrap">
                  <input
                    type="search"
                    id="playerSearch"
                    class="form-control form-control-sm"
                    placeholder="Search player…"
                    autocomplete="off"
                    role="combobox"
                    aria-expanded="false"
                    aria-controls="searchResults"
                  />
                  <ul id="searchResults" role="listbox" hidden></ul>
                </div>
                <!-- Current pick and the assign controls share one row. -->
                <div id="pickRow">
                  <span id="selectedPlayer" class="is-empty">
                    <span class="selected-empty">No player selected</span>
                  </span>
                  <div class="action-controls">
                    <div
                      id="assignPrice-group"
                      class="input-group input-group-sm"
                    >
                      <input
                        type="number"
                        id="assignPrice"
                        class="form-control form-control-sm"
                        aria-label="Price"
                        min="1"
                      />
                      <span class="input-group-text">fM</span>
                    </div>
                    <!-- Bootstrap Icons check, inlined: the icon font isn't loaded. -->
                    <button
                      id="assignBtn"
                      class="btn btn-orange btn-sm"
                      title="Assign"
                      aria-label="Assign"
                    >
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="18"
                        height="18"
                        viewBox="0 0 16 16"
                        fill="currentColor"
                        aria-hidden="true"
                      >
                        <path
                          d="M10.97 4.97a.75.75 0 0 1 1.07 1.05l-3.99 4.99a.75.75 0 0 1-1.08.02L4.324 8.384a.75.75 0 1 1 1.06-1.06l2.094 2.093 3.473-4.425a.24.24 0 0 1 .02-.022z"
                        />
                      </svg>
                    </button>
                    <!-- Bootstrap Icons trash3, inlined: the icon font isn't loaded. -->
                    <button
                      id="resetBtn"
                      class="btn btn-secondary btn-sm"
                      title="Reset"
                      aria-label="Reset"
                    >
                      <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="16"
                        height="16"
                        viewBox="0 0 16 16"
                        fill="currentColor"
                        aria-hidden="true"
                      >
                        <path
                          d="M6.5 1h3a.5.5 0 0 1 .5.5v1H6v-1a.5.5 0 0 1 .5-.5M11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3A1.5 1.5 0 0 0 5 1.5v1H1.5a.5.5 0 0 0 0 1h.538l.853 10.66A2 2 0 0 0 4.885 16h6.23a2 2 0 0 0 1.994-1.84l.853-10.66h.538a.5.5 0 0 0 0-1zm1.958 1-.846 10.58a1 1 0 0 1-.997.92h-6.23a1 1 0 0 1-.997-.92L3.042 3.5zm-7.487 1a.5.5 0 0 1 .528.47l.5 8.5a.5.5 0 0 1-.998.06L5 5.03a.5.5 0 0 1 .47-.53Zm5.058 0a.5.5 0 0 1 .47.53l-.5 8.5a.5.5 0 1 1-.998-.06l.5-8.5a.5.5 0 0 1 .528-.47M8 4.5a.5.5 0 0 1 .5.5v8.5a.5.5 0 0 1-1 0V5a.5.5 0 0 1 .5-.5"
                        />
                      </svg>
                    </button>
                  </div>
                </div>
                <div id="assignMsg" role="status"></div>
              </div>

              <div id="roleFilterActions">
                <span class="text-muted">Roles:</span>
                <button
                  type="button"
                  id="rolesAll"
                  class="btn btn-link btn-sm p-0"
                >
                  Select all
                </button>
                <button
                  type="button"
                  id="rolesNone"
                  class="btn btn-link btn-sm p-0"
                >
                  Deselect all
                </button>
                <div id="statusFilters" class="form-check">
                  <input
                    type="checkbox"
                    class="form-check-input"
                    id="hideSold"
                    autocomplete="off"
                  />
                  <label class="form-check-label" for="hideSold"
                    >Hide sold</label
                  >
                </div>
              </div>
              <div id="roleFilter" role="group" aria-label="Filter by role">
                <input
                  type="checkbox"
                  class="btn-check"
                  id="role-Por"
                  value="Por"
                  autocomplete="off"
                />
                <label class="btn btn-sm btn-outline-secondary" for="role-Por"
                  >Por</label
                >
                <input
                  type="checkbox"
                  class="btn-check"
                  id="role-Dd"
                  value="Dd"
                  autocomplete="off"
                />
                <label class="btn btn-sm btn-outline-secondary" for="role-Dd"
                  >Dd</label
                >
                <input
                  type="checkbox"
                  class="btn-check"
                  id="role-Dc"
                  value="Dc"
                  autocomplete="off"
                />
                <label class="btn btn-sm btn-outline-secondary" for="role-Dc"
                  >Dc</label
                >
                <input
                  type="checkbox"
                  class="btn-check"
                  id="role-Ds"
                  value="Ds"
                  autocomplete="off"
                />
                <label class="btn btn-sm btn-outline-secondary" for="role-Ds"
                  >Ds</label
                >
                <input
                  type="checkbox"
                  class="btn-check"
                  id="role-B"
                  value="B"
                  autocomplete="off"
                />
                <label class="btn btn-sm btn-outline-secondary" for="role-B"
                  >B</label
                >
                <input
                  type="checkbox"
                  class="btn-check"
                  id="role-E"
                  value="E"
                  autocomplete="off"
                />
                <label class="btn btn-sm btn-outline-secondary" for="role-E"
                  >E</label
                >
                <input
                  type="checkbox"
                  class="btn-check"
                  id="role-M"
                  value="M"
                  autocomplete="off"
                />
                <label class="btn btn-sm btn-outline-secondary" for="role-M"
                  >M</label
                >
                <input
                  type="checkbox"
                  class="btn-check"
                  id="role-C"
                  value="C"
                  autocomplete="off"
                />
                <label class="btn btn-sm btn-outline-secondary" for="role-C"
                  >C</label
                >
                <input
                  type="checkbox"
                  class="btn-check"
                  id="role-W"
                  value="W"
                  autocomplete="off"
                />
                <label class="btn btn-sm btn-outline-secondary" for="role-W"
                  >W</label
                >
                <input
                  type="checkbox"
                  class="btn-check"
                  id="role-T"
                  value="T"
                  autocomplete="off"
                />
                <label class="btn btn-sm btn-outline-secondary" for="role-T"
                  >T</label
                >
                <input
                  type="checkbox"
                  class="btn-check"
                  id="role-A"
                  value="A"
                  autocomplete="off"
                />
                <label class="btn btn-sm btn-outline-secondary" for="role-A"
                  >A</label
                >
                <input
                  type="checkbox"
                  class="btn-check"
                  id="role-Pc"
                  value="Pc"
                  autocomplete="off"
                />
                <label class="btn btn-sm btn-outline-secondary" for="role-Pc"
                  >Pc</label
                >
              </div>
            </div>
            <div id="playerListTableWrap">
              <table class="table table-sm table-hover mb-0">
                <thead>
                  <tr>
                    <th id="sortRoles" class="sortable">
                      Roles <span class="sort-caret"></span>
                    </th>
                    <th id="sortName" class="sortable">
                      Name <span class="sort-caret"></span>
                    </th>
                    <th id="sortTeam" class="sortable">
                      Team <span class="sort-caret"></span>
                    </th>
                    <th id="sortQt" class="sortable text-end">
                      Qt <span class="sort-caret"></span>
                    </th>
                    <th class="text-end">FVM</th>
                    <th id="soldHeader" class="text-center">Sold</th>
                  </tr>
                </thead>
                <tbody id="playerListBody">
                  <!-- sample rows (layout only) -->
                  <tr>
                    <td><span class="role-badge role-A">A</span></td>
                    <td>Lautaro Martinez</td>
                    <td>Inter</td>
                    <td class="text-end">30</td>
                    <td class="text-end">95</td>
                    <td class="text-center"></td>
                  </tr>
                  <tr>
                    <td>
                      <span class="role-badge role-Ds">Ds</span
                      ><span class="role-badge role-E">E</span>
                    </td>
                    <td>Theo Hernandez</td>
                    <td>Milan</td>
                    <td class="text-end">18</td>
                    <td class="text-end">60</td>
                    <td class="text-center"></td>
                  </tr>
                  <tr class="sold-row">
                    <td><span class="role-badge role-Por">Por</span></td>
                    <td>Carnesecchi</td>
                    <td>Atalanta</td>
                    <td class="text-end">18</td>
                    <td class="text-end">80</td>
                    <td class="text-center">
                      <span class="badge text-bg-secondary">Nico · 18</span>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- TEAMS SIDEBAR + SALES LOG -->
        <aside id="teamsColumn">
          <div id="teamsPanel">
            <div id="teamsZone">
              <!-- filled from the loaded auction by auction.js -->
            </div>
          </div>

          <div id="logPanel">
            <div id="auctionLogHead">Log</div>
            <ul id="auctionLogList">
              <!-- one entry per sale, newest first -->
            </ul>
          </div>
        </aside>

        <!-- TEAM ROSTER — empty for now -->
        <section id="rosterZone">
          <div id="mineRosterPanel">
            <div id="mineRosterInner">
              <div id="mineRosterName">
                <span id="mineRosterNameText"></span>
                <span id="mineRosterStats"></span>
                <button type="button" id="mineRosterEditBtn" title="Edit" aria-label="Edit">
                  <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                    <path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168l10-10zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207 11.207 2.5zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293l6.5-6.5zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325z"/>
                  </svg>
                </button>
              </div>
              <div id="mineRosterTableWrap">
                <table id="mineRosterTable">
                  <tbody id="mineRosterBody">
                    <!-- one row per player bought, filled by auction.js -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>
          <div id="rosterPanel"></div>
        </section>
      </main>
    </div>

    <script src="auction.js"></script>
  </body>
</html>
